# Railway service config (Dockerfile is auto-detected; this sets health + restart policy).
# Attach a Postgres plugin and mount a volume at /data (or set STORAGE_BACKEND=s3).
# Required env: CHURN_MASTER_KEY, FIREBASE_SERVICE_ACCOUNT_JSON (or GOOGLE_APPLICATION_CREDENTIALS),
# DATABASE_URL (from the Postgres plugin), ADMIN_EMAILS. Optional: REDIS_URL, CORS_ORIGINS, VITE_* at build time.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/ready"   # database, schema, storage and encryption keys; /api/health only says the process is up
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
